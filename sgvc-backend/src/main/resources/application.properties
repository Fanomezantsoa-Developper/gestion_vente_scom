# Nom de l'application
spring.application.name=sgvc-backend

# Connexion à la base de données (MariaDB via XAMPP)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/sgvc_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port du serveur Spring Boot
server.port=8080

# ------------------------------------------------------------------
# Sécurité JWT
# ------------------------------------------------------------------
# Clé secrète fixe (HS256) : les tokens restent valides après redémarrage.
# En production, remplacez-la par une variable d'environnement (JWT_SECRET).
app.jwt.secret=Y2hhbmdlLW1lLXNlY3JldC1rZXktc2d2Yy1wcm9qZXQtMjAyNi1kZW1vLXNlY3VyZQ==
# Durée de vie du token : 10 heures par défaut
app.jwt.expiration-ms=36000000

# ------------------------------------------------------------------
# Swagger / OpenAPI
# ------------------------------------------------------------------
# Interface accessible sur http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html